services:
  - type: web
    name: labquest-science-learning
    env: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
